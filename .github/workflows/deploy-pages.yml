name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite application
        run: npm run build

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub Pages is still running its automatic branch/Jekyll deployment.
      # The latest Jekyll deployment finished several minutes AFTER the Vite deployment
      # and overwrote the working site. Wait until Jekyll is finished, then publish Vite last.
      - name: Wait for branch-based Pages deployment to finish
        run: sleep 480

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
